# conf/tasks.yaml

architect_task:
  description: |
    Thoroughly analyze the incoming infrastructure request: '{user_request}'.
    Follow your defined core workflow to isolate the precise subset of REST API names required, deduce structural data dependencies, and formulate a comprehensive multi-file task topology layout.
  expected_output: "A strict JSON data object strictly adhering to the BlueprintSchema Pydantic model, detailing the filtered APIs and the comprehensive workflow design."

coder_task:
  description: |
    Analyze the execution workflow design blueprint provided by the upstream [Automation Architect].
    Execute the code generation strictly following the Standard Operating Procedure (SOP) and compliance rules defined in your core workflow.
    Translate the structured JSON layout into real production-grade Ansible automation playbook matrices and commit them to local disk storage using your assigned MCP tools.
  expected_output: "A file system layout execution confirmation verifying that the completed playbook matrices were committed to local disk storage."

reviewer_task:
  description: |
    Perform a rigorous compliance audit and quality assurance review on the compiled and deployed playbook files.
    Execute your audit strictly according to the two phases (Physical Syntax Validation and API Semantic Audit) defined in your core workflow.
    Cross-reference the retrieved code against the [Automation Architect]'s structured JSON design blueprint and ensure all compliance boundaries are met. Correct and commit any necessary fixes.
  expected_output: "A final compliance receipt validating architectural fidelity, syntax perfection, and rule adherence across all committed automation files."