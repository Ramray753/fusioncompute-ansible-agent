- name: FusionCompute - Query VM and Print Disk Datastore Names
  hosts: localhost
  vars_files:
    # Global environment configuration file.
    # Contains infrastructure-level connection parameters such as fc_hostname, fc_username, and fc_password.
    - ./commons.yml

  vars:
    user_config:
      # Please put all user-defined variables here.
      # The name of the virtual machine to query.
      vm_name: 'api-demo-001'

  tasks:
  # =========================================================================
  # PHASE 1: Fuzzy Search VM by Name and Extract VM ID
  # =========================================================================

  # [Task 1.1] Perform a fuzzy search for VMs matching the user-specified name.
  # This uses the GET /vms?name=... endpoint to retrieve a list of candidate VMs.
  - name: "[Task 1.1] - Generic Module - Fuzzy Search VM by Name"
    huawei.fusioncompute.fc_generic:
      fc_hostname: '{{ fc_hostname }}'
      fc_username: '{{ fc_username }}'
      fc_password: '{{ fc_password }}'
      fc_method: '{{ fc_method }}'
      fc_url: '{{ fc_url }}'
    vars:
      fc_method: 'get'
      fc_url: '/vms?name={{ user_config.vm_name }}'
    register: output_vm_search

  # [Task 1.2] Print the raw fuzzy search result for debugging and confirmation.
  - name: "[Task 1.2] - Debug Print VM Search Result"
    debug:
      msg: '{{ output_vm_search }}'

  # [Task 1.3] Extract the VM ID by performing an exact name match on the fuzzy search results.
  # The expression filters the vms array by exact name, takes the first match,
  # and extracts the last segment of the URN (which is the VM ID, e.g., i-0000050E).
  - name: "[Task 1.3] - Extract VM ID by Exact Name Match"
    set_fact:
      vm_id: "{{ (output_vm_search.ret.rsp.vms | selectattr('name', 'equalto', user_config.vm_name) | list | first).urn.split(':') | last }}"
    when:
      - output_vm_search.ret.rsp.vms is defined
      - output_vm_search.ret.rsp.vms | length > 0
      - (output_vm_search.ret.rsp.vms | selectattr('name', 'equalto', user_config.vm_name) | list | length) > 0

  # [Task 1.4] Print the extracted VM ID for user confirmation.
  - name: "[Task 1.4] - Debug Print Extracted VM ID"
    debug:
      msg: '{{ vm_id }}'

  # =========================================================================
  # PHASE 2: Query VM Details by ID
  # =========================================================================

  # [Task 2.1] Query the full VM details using the extracted VM ID.
  # This uses the GET /vms/{vm_id} endpoint which returns vmConfig with disks array.
  # Guard condition: skip if no VM ID was extracted in Phase 1.
  - name: "[Task 2.1] - Generic Module - Query VM Details by ID"
    huawei.fusioncompute.fc_generic:
      fc_hostname: '{{ fc_hostname }}'
      fc_username: '{{ fc_username }}'
      fc_password: '{{ fc_password }}'
      fc_method: '{{ fc_method }}'
      fc_url: '{{ fc_url }}'
    vars:
      fc_method: 'get'
      fc_url: '/vms/{{ vm_id }}'
    register: output_vm_details
    when: vm_id is defined

  # [Task 2.2] Print the full VM details response for debugging and structural confirmation.
  # Guard condition: skip if no VM ID was extracted in Phase 1.
  - name: "[Task 2.2] - Debug Print VM Details Output"
    debug:
      msg: '{{ output_vm_details }}'
    when: vm_id is defined

  # =========================================================================
  # PHASE 3: Output Results - VM ID and Disk Datastore Names
  # =========================================================================

  # [Task 3.1] Print a header showing the VM ID to clearly identify the target VM.
  # Guard condition: skip if no VM ID was extracted in Phase 1.
  - name: "[Task 3.1] - Print VM ID Header"
    debug:
      msg: "=== VM ID: {{ vm_id }} ==="
    when: vm_id is defined

  # [Task 3.2] Iterate over each disk in vmConfig.disks and print its datastore name.
  # Each disk object contains 'datastoreName' which is the name of the datastore
  # where the disk resides (only valid in query responses).
  # Guard conditions: skip if Phase 1 found no VM or Phase 2 produced no details.
  - name: "[Task 3.2] - Loop and Print Each Disk's Datastore Name"
    debug:
      msg: "Disk [{{ item.sequenceNum | default('N/A') }}] - Datastore: {{ item.datastoreName | default('N/A') }}"
    loop: "{{ output_vm_details.ret.rsp.vmConfig.disks }}"
    when:
      - vm_id is defined
      - output_vm_details is defined
      - output_vm_details.ret.rsp.vmConfig is defined
      - output_vm_details.ret.rsp.vmConfig.disks is defined
