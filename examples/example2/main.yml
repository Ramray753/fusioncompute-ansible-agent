- name: FusionCompute Automation - Upload and Execute Custom Script on VM
  hosts: localhost
  vars_files:
    # Global environment configuration file.
    # Contains infrastructure-level connection parameters such as fc_hostname, fc_username, and fc_password.
    - ./commons.yml

  vars:
    user_config:
      # Please put all user-defined variables here.
      # The name of the target VM on which the custom script will be uploaded and executed.
      vm_name: 'api-demo-001'

  tasks:
    # =========================================================================
    # PHASE 1: Discover the target VM by fuzzy-searching its name and extract the VM ID.
    # =========================================================================

    # [Task 1.1] Fuzzy-search VMs by name to obtain the VM URN.
    # Corresponding API: <过滤分页查询所有虚拟机信息>
    - name: "[Task 1.1] - Generic Module - Get VM ID by Name"
      huawei.fusioncompute.fc_generic:
        fc_hostname: '{{ fc_hostname }}'
        fc_username: '{{ fc_username }}'
        fc_password: '{{ fc_password }}'
        fc_method: 'get'
        fc_url: '/vms?name={{ user_config.vm_name }}'
      register: output_task_1_1

    # [Task 1.2] Print the raw query output for observability.
    - name: "[Task 1.2] - Print Raw VM Query Output"
      debug:
        msg: '{{ output_task_1_1 }}'

    # [Task 1.3] Extract the VM ID from the first matching VM's URN.
    # The ID is the last colon-delimited segment of the URN field.
    - name: "[Task 1.3] - Extract VM ID"
      set_fact:
        vm_id: "{{ (output_task_1_1.ret.rsp.vms | first).urn.split(':') | last }}"

    # [Task 1.4] Print the extracted VM ID for verification.
    - name: "[Task 1.4] - Print VM ID"
      debug:
        msg: '{{ vm_id }}'

    # =========================================================================
    # PHASE 2: Retrieve detailed VM configuration to determine the OS type.
    # =========================================================================

    # [Task 2.1] Retrieve detailed VM information by VM ID.
    # Corresponding API: <查询指定虚拟机信息>
    - name: "[Task 2.1] - Generic Module - Get VM Details by ID"
      huawei.fusioncompute.fc_generic:
        fc_hostname: '{{ fc_hostname }}'
        fc_username: '{{ fc_username }}'
        fc_password: '{{ fc_password }}'
        fc_method: 'get'
        fc_url: '/vms/{{ vm_id }}'
      register: output_task_2_1

    # [Task 2.2] Print the detailed VM info output.
    - name: "[Task 2.2] - Print VM Details Output"
      debug:
        msg: '{{ output_task_2_1 }}'

    # [Task 2.3] Extract osOptions.osType from the VM details.
    - name: "[Task 2.3] - Extract OS Type"
      set_fact:
        os_type: "{{ output_task_2_1.ret.rsp.osOptions.osType }}"

    # [Task 2.4] Print the extracted OS type for observability.
    - name: "[Task 2.4] - Print OS Type"
      debug:
        msg: '{{ os_type }}'

    # =========================================================================
    # PHASE 3: Conditionally derive script parameters based on OS type.
    # =========================================================================

    # [Task 3.1] Assemble script content, type, and filename based on OS type.
    #   - Linux   -> scriptContent="hostname", scriptType="sh",   scriptFileName="script.sh"
    #   - Windows -> scriptContent="Get-ComputerInfo", scriptType="powershell", scriptFileName="script.ps1"
    - name: "[Task 3.1] - Set Script Parameters Based on OS Type"
      set_fact:
        script_content: "{{ 'hostname' if os_type == 'Linux' else 'Get-ComputerInfo' }}"
        script_type: "{{ 'sh' if os_type == 'Linux' else 'powershell' }}"
        script_file_name: "{{ 'script.sh' if os_type == 'Linux' else 'script.ps1' }}"

    # =========================================================================
    # PHASE 4: Upload and execute the custom script on the target VM.
    # =========================================================================

    # [Task 4.1] POST request to upload and execute the script with execMode=0.
    # Corresponding API: <给虚拟机上传自定义脚本>
    - name: "[Task 4.1] - Generic Module - Upload and Execute Custom Script"
      huawei.fusioncompute.fc_generic:
        fc_hostname: '{{ fc_hostname }}'
        fc_username: '{{ fc_username }}'
        fc_password: '{{ fc_password }}'
        fc_method: 'post'
        fc_url: '/vms/{{ vm_id }}/action/uploadAndExecVmScript'
        fc_body:
          vmId: '{{ vm_id }}'
          execMode: 0
          scriptContent: '{{ script_content }}'
          scriptType: '{{ script_type }}'
          scriptFileName: '{{ script_file_name }}'
      register: output_task_4_1

    # [Task 4.2] Track and wait for the asynchronous script upload/execution task.
    # The wait_fc_system_task.yml template handles two-phase polling:
    #   Phase 1 - poll the primary task until terminal status.
    #   Phase 2 - poll any system-spawned follow-up tasks (e.g., InjectCustomizationTask).
    # Stores the final task query response in _sys_query_output_script_upload.
    - name: "[Task 4.2] - Track and Wait for FusionCompute Tasks"
      include_tasks: wait_fc_system_task.yml
      vars:
        async_output: '{{ output_task_4_1 }}'
        task_id_suffix: 'script_upload'

    # [Task 4.3] Print the final task completion result.
    # Includes status, progress, finishTime, entityName, and any embedded execution output.
    - name: "[Task 4.3] - Access the Returned Task Completion Info"
      debug:
        msg: '{{ _sys_query_output_script_upload }}'
      # Use default() to avoid errors if the task condition in wait_fc_system_task.yml was not met
      when: _sys_query_output_script_upload is defined
