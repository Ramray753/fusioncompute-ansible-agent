# =========================================================================
# FusionCompute Asynchronous Task Tracking Module
# =========================================================================
# This reusable task file encapsulates a two-phase polling mechanism to track
# the lifecycle of asynchronous FusionCompute API operations.
#
# Phase 1: Extracts the primary task URN from the async POST response, then
#           polls until the task status reaches a terminal state (success/failed).
#
# Phase 2: Pagination-queries system-scheduled follow-up tasks (e.g.,
#           InjectCustomizationTask) spawned by the primary task, polls those
#           until completion.
#
# The final task query response is stored in a dynamically-named fact:
#   _sys_query_output_{{ task_id_suffix }}
#
# Input Variables (passed via include_tasks):
#   - async_output:     The registered output from the fc_generic POST/PUT call.
#   - task_id_suffix:   A unique suffix to namespace the stored facts.
# =========================================================================

# --- Phase 1: Primary Task Polling ---

# Extract the numeric task ID from the task URN returned by the async POST.
- name: Extract Task ID
  set_fact:
    _primary_task_id: "{{ async_output.ret.rsp.taskUrn.split(':') | last }}"

- name: Print Task ID
  debug:
    msg: '{{ _primary_task_id }}'

# Poll the primary task until it reaches a terminal state (success or failed).
- name: Wait Until Primary Task Completed
  huawei.fusioncompute.fc_task_manager:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    action: 'complete'
    fc_task_id: '{{ _primary_task_id }}'
    fc_pull_interval: '{{ fc_pull_interval }}'
    fc_wait_timeout: '{{ fc_wait_timeout }}'
  register: _primary_task_output

- name: Save Unique Primary Task Output Fact
  set_fact:
    _sys_primary_output_{{ task_id_suffix }}: '{{ _primary_task_output }}'

- name: Print Primary Task Output
  debug:
    msg: '{{ _primary_task_output }}'

# --- Phase 2: System-Scheduled Follow-Up Task Polling ---

# Extract the entity URN from the completed primary task to locate follow-up tasks.
- name: Extract Entity URN
  set_fact:
    _entity_urn: "{{ _primary_task_output.ret.rsp.entityUrn }}"

- name: Print Entity URN
  debug:
    msg: '{{ _entity_urn }}'

# Pagination-query tasks filtered by the entity URN to discover system-spawned tasks.
- name: Get System Scheduling Task ID
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'get'
    fc_url: '/tasks?entityUrn={{ _entity_urn }}'
  register: _pagination_output

- name: Save Unique Pagination Output Fact
  set_fact:
    _sys_pagination_output_{{ task_id_suffix }}: '{{ _pagination_output }}'

- name: Print Pagination Output
  debug:
    msg: '{{ _pagination_output }}'

# Extract the system scheduling task ID from the pagination results.
# Filters tasks matching the entity URN and excludes the primary task itself.
- name: Extract System Scheduling Task ID
  set_fact:
    _sys_task_id: "{{ (_pagination_output.ret.rsp.tasks | selectattr('entityUrn', 'equalto', _entity_urn) | selectattr('taskId', 'ne', _primary_task_id) | first).taskId | default('') }}"

- name: Print System Scheduling Task ID
  debug:
    msg: '{{ _sys_task_id }}'

# Poll the system scheduling task if one was found.
- name: Wait Until System Scheduling Task Completed
  huawei.fusioncompute.fc_task_manager:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    action: 'complete'
    fc_task_id: '{{ _sys_task_id }}'
    fc_pull_interval: '{{ fc_pull_interval }}'
    fc_wait_timeout: '{{ fc_wait_timeout }}'
  register: _sys_task_output
  when: _sys_task_id | length > 0

# Persist the final task query response for consumption by the caller.
- name: Save Unique System Scheduling Task Output Fact
  set_fact:
    _sys_query_output_{{ task_id_suffix }}: '{{ _sys_task_output }}'
  when: _sys_task_id | length > 0

- name: Print System Scheduling Task Output
  debug:
    msg: '{{ _sys_task_output }}'
  when: _sys_task_id | length > 0
