- name: FusionCompute Batch VM Tools Query - Parallel Execution
  hosts: localhost
  vars_files:
    # Global environment configuration file.
    # Contains infrastructure-level connection parameters such as fc_hostname, fc_username, and fc_password.
    - ./commons.yml

  vars:
    user_config:
      # Path to the CSV file containing VM names (one per line, no header row).
      input_vm_names_csv: './vm_names.csv'

  tasks:
    # =========================================================================
    # Play 1: Data Preparation & Dynamic Inventory Construction
    # =========================================================================

    # [Task 1.1] Read the input CSV file line by line and split into a list.
    - name: '[Task 1.1] - Read VM names from CSV file using built-in file lookup'
      set_fact:
        vm_list: "{{ lookup('ansible.builtin.file', user_config.input_vm_names_csv).splitlines()[:] }}"

    # [Task 1.2] Dynamically add each non-empty VM name to the temporary inventory group 'dynamic_vms'.
    - name: '[Task 1.2] - Dynamically add VMs to a temporary inventory group'
      ansible.builtin.add_host:
        name: "{{ item | trim }}"
        groups: dynamic_vms
      loop: "{{ vm_list }}"
      when: item | trim | length > 0

# =========================================================================
# Play 2: Parallel Batch Query (hosts: dynamic_vms, serial controlled by fc_concurrency)
# =========================================================================
- name: Parallel Batch VM Tools Query Execution
  hosts: dynamic_vms
  gather_facts: no
  connection: local
  # Read the concurrency parameter from localhost's hostvars to control parallel batch size.
  serial: "{{ hostvars['localhost'].fc_concurrency | default(5) }}"
  vars_files:
    - ./commons.yml
  tasks:
    # [Task 2.1] Include the single-VM query logic file, passing the VM name as a variable.
    - name: '[Task 2.1] - Include VM tools query sequence for the current batch'
      ansible.builtin.include_tasks: query_vm_tools.yml
      vars:
        vm_name_item: "{{ inventory_hostname }}"

# =========================================================================
# Play 3: Result Aggregation & Cleanup (hosts: localhost)
# =========================================================================
- name: Aggregate Results and Clean Up
  hosts: localhost
  gather_facts: no
  vars_files:
    - ./commons.yml
  tasks:
    # [Task 3.1] Invoke the Python aggregation script to merge all per-VM temp CSV files into the final output.
    - name: '[Task 3.1] - Execute Python aggregation script to build final CSV'
      ansible.builtin.command:
        cmd: python3 aggregate_results.py
      args:
        chdir: "{{ playbook_dir }}"
      register: aggregation_result
      changed_when: false

    - name: '[Task 3.1a] - Print aggregation script output'
      debug:
        msg: "{{ aggregation_result.stdout_lines }}"
      when: aggregation_result.stdout_lines is defined

    # [Task 3.2] Remove the temporary directory holding intermediate per-VM CSV files.
    - name: '[Task 3.2] - Clean up temporary directory'
      ansible.builtin.file:
        path: "{{ playbook_dir }}/.tmp_vm_tools"
        state: absent
