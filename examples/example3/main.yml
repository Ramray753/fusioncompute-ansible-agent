- name: FusionCompute Datastore-Host Association Batch Workflow
  hosts: localhost
  vars_files:
    - ./commons.yml

  vars:
    user_config:
      datastore_names_csv: './datastore_names.csv'
      host_names_csv: './host_names.csv'

  tasks:
  - name: '[Task 1.1] Read datastore names from CSV file'
    set_fact:
      ds_list: "{{ lookup('ansible.builtin.file', user_config.datastore_names_csv).splitlines()[:] }}"

  - name: '[Task 1.2] Read host names from CSV file'
    set_fact:
      host_list: "{{ lookup('ansible.builtin.file', user_config.host_names_csv).splitlines()[:] }}"

  - name: '[Task 1.3] Outer loop — process each datastore sequentially'
    ansible.builtin.include_tasks: process_single_datastore.yml
    loop: '{{ ds_list }}'
    loop_control:
      loop_var: ds_name_item
    when: ds_name_item | trim | length > 0
