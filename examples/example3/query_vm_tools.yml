# =========================================================================
# Single-VM Tools Query Business Logic
# =========================================================================
# This file is invoked in parallel for each VM name in the dynamic_vms group.
# It performs a two-step query chain:
#   1. Fuzzy-search for the VM by name to retrieve its ID.
#   2. Query the detailed VM information by ID to extract pvDriverStatus and toolsVersion.
#   3. Write a single-row CSV to a per-VM temporary file.

# [Task 4.1] Fuzzy-search all VMs by name to locate the target VM and retrieve its URN.
- name: '[Task 4.1] - Generic Module - Get VM list by name for {{ vm_name_item }}'
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'get'
    fc_url: '/vms?name={{ vm_name_item }}'
  register: output_vm_list

# [Task 4.2] Extract the VM ID from the first exact-name match in the fuzzy search results.
# Uses selectattr to ensure an exact match against the VM name, preventing fuzzy query conflicts.
- name: '[Task 4.2] - Extract VM ID for {{ vm_name_item }} via exact name match'
  set_fact:
    _vm_id: "{{ (output_vm_list.ret.rsp.vms | selectattr('name', 'equalto', vm_name_item) | first).urn.split(':') | last }}"
  when:
    - output_vm_list.ret.rsp.vms | length > 0
    - (output_vm_list.ret.rsp.vms | selectattr('name', 'equalto', vm_name_item) | list | length) > 0

# [Task 4.3] Query the detailed VM information by its resolved ID.
- name: '[Task 4.3] - Generic Module - Get VM details by ID for {{ vm_name_item }}'
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'get'
    fc_url: '/vms/{{ _vm_id }}'
  register: output_vm_detail
  when: _vm_id is defined

# [Task 4.4] Extract pvDriverStatus and toolsVersion from the detailed VM response.
- name: '[Task 4.4] - Extract Tools status and version for {{ vm_name_item }}'
  set_fact:
    _pv_driver_status: "{{ output_vm_detail.ret.rsp.pvDriverStatus }}"
    _tools_version: "{{ output_vm_detail.ret.rsp.toolsVersion }}"
  when:
    - output_vm_detail is not skipped
    - output_vm_detail.ret.rsp is defined

# [Task 4.5] Write a single-row CSV line to a per-VM temporary file.
# Each file is isolated to avoid race conditions during parallel execution.
- name: '[Task 4.5] - Write single-row CSV to temporary file for {{ vm_name_item }}'
  ansible.builtin.copy:
    content: "{{ vm_name_item }},{{ _vm_id }},{{ _pv_driver_status }},{{ _tools_version }}\n"
    dest: "{{ playbook_dir }}/.tmp_vm_tools/{{ vm_name_item }}.csv"
  when:
    - _vm_id is defined
    - _pv_driver_status is defined
    - _tools_version is defined
