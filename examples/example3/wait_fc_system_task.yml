# =========================================================================
# Asynchronous Task Tracking Module
# =========================================================================
# This file encapsulates the two-phase polling logic required to track
# FusionCompute asynchronous tasks to completion.
#
# Usage:
#   include_tasks: wait_fc_system_task.yml
#   vars:
#     async_output: "{{ output_task_X }}"
#     task_id_suffix: "task_X"
#
# Phase 1: Wait for the primary task (e.g., DeployVM, StartVmTask) to complete.
# Phase 2: If a follow-up system scheduling task (e.g., InjectCustomizationTask)
#           exists for the same entity, wait for that to complete as well.

# Extract the primary task ID from the async operation output URN.
- name: Extract Task ID
  set_fact:
    _sys_task_id: "{{ async_output.ret.rsp.urn.split(':') | last }}"
  when:
    - async_output is not skipped
    - async_output.ret.rsp.urn is defined

- name: Print Task ID
  debug:
    msg: '{{ _sys_task_id }}'
  when: _sys_task_id is defined

# Wait until the primary task reaches a terminal state (success/failure).
- name: Wait Until Primary Task Completed
  huawei.fusioncompute.fc_task_manager:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    action: 'complete'
    fc_task_id: '{{ _sys_task_id }}'
    fc_pull_interval: '{{ fc_pull_interval | default(5) }}'
    fc_wait_timeout: '{{ fc_wait_timeout | default(180) }}'
  register: _sys_primary_task_output
  when: _sys_task_id is defined

# Persist the primary task completion result under a unique fact name.
- name: Save Unique Primary Task Output Fact
  set_fact:
    _sys_primary_task_output_{{ task_id_suffix }}: "{{ _sys_primary_task_output }}"
  when: _sys_primary_task_output is defined

- name: Print Primary Task Output
  debug:
    msg: '{{ _sys_primary_task_output }}'
  when: _sys_primary_task_output is defined

# Extract the entity URN from the primary task response for downstream system task lookup.
- name: Extract Entity URN
  set_fact:
    _sys_entity_urn: "{{ _sys_primary_task_output.ret.rsp.entityUrn }}"
  when:
    - _sys_primary_task_output is defined
    - _sys_primary_task_output.ret.rsp.entityUrn is defined

- name: Print Entity URN
  debug:
    msg: '{{ _sys_entity_urn }}'
  when: _sys_entity_urn is defined

# Query paginated tasks filtered by the entity URN to discover any system scheduling tasks.
- name: Get System Scheduling Task ID
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'get'
    fc_url: '/tasks?entityUrn={{ _sys_entity_urn }}&limit=20&offset=0'
  register: _sys_pagination_output
  when: _sys_entity_urn is defined

- name: Save Unique Pagination Output Fact
  set_fact:
    _sys_pagination_output_{{ task_id_suffix }}: "{{ _sys_pagination_output }}"
  when: _sys_pagination_output is defined

- name: Print Pagination Output
  debug:
    msg: '{{ _sys_pagination_output }}'
  when: _sys_pagination_output is defined

# Identify the system scheduling task (if any) that was triggered after the primary task.
- name: Extract System Scheduling Task ID
  set_fact:
    _sys_scheduling_task_id: "{{ (_sys_pagination_output.ret.rsp.tasks | selectattr('type', 'equalto', 'InjectCustomizationTask') | first).taskId | default('') }}"
  when:
    - _sys_pagination_output is defined
    - _sys_pagination_output.ret.rsp.tasks is defined

- name: Print System Scheduling Task ID
  debug:
    msg: '{{ _sys_scheduling_task_id }}'
  when: _sys_scheduling_task_id is defined

# Wait for the system scheduling task to complete, if one was found.
- name: Wait Until System Scheduling Task Completed
  huawei.fusioncompute.fc_task_manager:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    action: 'complete'
    fc_task_id: '{{ _sys_scheduling_task_id }}'
    fc_pull_interval: '{{ fc_pull_interval | default(5) }}'
    fc_wait_timeout: '{{ fc_wait_timeout | default(180) }}'
  register: _sys_scheduling_task_output
  when:
    - _sys_scheduling_task_id is defined
    - _sys_scheduling_task_id | length > 0

- name: Save Unique System Scheduling Task Output Fact
  set_fact:
    _sys_scheduling_task_output_{{ task_id_suffix }}: "{{ _sys_scheduling_task_output }}"
  when: _sys_scheduling_task_output is defined

- name: Print System Scheduling Task Output
  debug:
    msg: '{{ _sys_scheduling_task_output }}'
  when: _sys_scheduling_task_output is defined
