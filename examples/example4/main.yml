- name: FusionCompute Sequential Batch Host-Datastore Association Workflow
  hosts: localhost
  vars_files:
    # Global environment configuration file.
    # Contains infrastructure-level connection parameters such as fc_hostname, fc_username, and fc_password.
    - ./commons.yml

  vars:
    user_config:
      # Path to the CSV file containing host names (one host name per line, no header).
      task_host_names_csv: './host_names.csv'
      # Path to the CSV file containing datastore names (one datastore name per line, no header).
      task_datastore_names_csv: './datastore_names.csv'

  tasks:
    # =========================================================================
    # SEQUENTIAL BATCH: Host-Datastore Association Workflow
    # =========================================================================
    # For each host read from host_names.csv, iterate through every datastore
    # name read from datastore_names.csv and create a datastore association.
    # Execution is strictly sequential — each datastore creation and its
    # asynchronous task polling completes before the next iteration begins.

    # [Task 1.1] Read host_names.csv using built-in file lookup; split lines into a list.
    - name: "[Task 1.1] Read host names from CSV file"
      set_fact:
        host_list: "{{ lookup('ansible.builtin.file', user_config.task_host_names_csv).splitlines()[:] }}"

    # [Task 1.2] Read datastore_names.csv using built-in file lookup; split lines into a list.
    - name: "[Task 1.2] Read datastore names from CSV file"
      set_fact:
        datastore_list: "{{ lookup('ansible.builtin.file', user_config.task_datastore_names_csv).splitlines()[:] }}"

    # [Task 1.3] Sequentially loop over host_list; for each host invoke the
    # outer-loop business logic file. Skip empty/whitespace-only lines.
    - name: "[Task 1.3] Loop hosts and execute per-host datastore association sequence"
      ansible.builtin.include_tasks: associate_datastores_per_host.yml
      loop: "{{ host_list }}"
      loop_control:
        loop_var: host_name_item
      # Avoid processing accidental empty rows at the end of the file
      when: host_name_item | trim | length > 0
