# =========================================================================
# FusionCompute Global Infrastructure Environment Configuration
# =========================================================================
# This manifest isolates target endpoint connectivity properties, authentication 
# payloads, and polling thresholds away from individual playbooks to ensure reusability.

# The IPv4 address or Fully Qualified Domain Name (FQDN) of the FusionCompute VRM management node.
fc_hostname: '192.168.100.100'

# The administrative or service-account security principal authorized to invoke REST API operations.
fc_username: 'api_user'

# The plaintext authentication credential paired with the designated API account principal.
fc_password: 'P@ssw0rd123'

# The maximum execution window threshold in seconds that asynchronous job polling modules are permitted to block before throwing a timeout failure.
fc_wait_timeout: 180

# The frequency cycle rate in seconds at which the playbook queries the endpoint status to verify asynchronous job completion.
fc_pull_interval: 5

# The default concurrency level for batch operations
fc_concurrency: 10