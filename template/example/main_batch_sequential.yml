- name: FusionCompute Ansible Example For Agent - Best Practice for Batch API Calls in Sequential
  hosts: localhost
  vars_files:
    - ./commons.yml

  vars:
    user_config:
      task_10_vm_names_csv: './vm_names_stop.csv'

  tasks:  
  # =========================================================================
  # EXAMPLE 4 - Batch Operations in Sequential (TASK 10)
  # =========================================================================
  # Batch Operation Strategies for Serial Execution: 
  # 1. Use 'lookup' in main.yml to read the resource list from a CSV file. 
  # 2. Move the execution logic to a separate YAML file.
  # 3. Invoke this file it in main.yml using 'include_tasks' with 'loop' and 'loop_var'.

  # TASK 10: Sequentially perform batch VM stop given a VM name list using built-in tools.
  - name: TASK 10.1 - Read file lines using built-in file lookup
    set_fact:
      # lookup('file') reads the content, splitlines() converts lines into an Ansible list.
      # If the CSV has a header row, change '[:]' to '[1:]' or remove it.
      vm_list: "{{ lookup('ansible.builtin.file', user_config.task_10_vm_names_csv).splitlines()[:] }}"

  - name: TASK 10.2 - Loop and execute VM stop sequence
    ansible.builtin.include_tasks: stop_single_vm.yml
    loop: "{{ vm_list }}"
    loop_control:
      loop_var: vm_name_item
    # Avoid processing accidental empty rows at the end of the file
    when: vm_name_item | trim | length > 0