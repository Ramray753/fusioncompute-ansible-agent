# This file is invoked sequentially for each VM name parsed from the file.
- name: TASK 10.3 - GET VM Details by Name for {{ vm_name_item }}
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}'
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'get'
    fc_url: '/vms?name={{ vm_name_item }}' # Corresponding API: <查询虚拟机信息-过滤分页查询所有虚拟机信息>

  register: output_task_10_3

- name: TASK 10.4 - Extract VM ID for {{ vm_name_item }}
  set_fact:
    # Use selectattr to ensure an exact match against the VM name, preventing fuzzy query conflicts
    _current_vm_id: "{{ (output_task_10_3.ret.rsp.vms | selectattr('name', 'equalto', vm_name_item) | first).urn.split(':') | last }}"
  # Execute only if the matching asset is found in the returned array
  when: 
    - output_task_10_3.ret.rsp.vms | length > 0
    - (output_task_10_3.ret.rsp.vms | selectattr('name', 'equalto', vm_name_item) | list | length) > 0

- name: TASK 10.5 - Generic Module - VM Stop for {{ vm_name_item }}
  huawei.fusioncompute.fc_generic:
    fc_hostname: '{{ fc_hostname }}' 
    fc_username: '{{ fc_username }}'
    fc_password: '{{ fc_password }}'
    fc_method: 'post'
    fc_url: '/vms/{{ _current_vm_id }}/action/stop' # Corresponding API: <停止虚拟机>
    fc_body: 
      mode: "safe"
  register: output_task_10_5
  # Target block execution depends on valid resolution of the identifier asset
  when: output_task_10_3.ret.rsp.vms | length > 0 and _current_vm_id is defined

- name: TASK 10.6 - Track and Wait for FusionCompute Tasks
  include_tasks: wait_fc_system_task.yml
  vars:
    async_output: "{{ output_task_10_5 }}"
    task_id_suffix: "task_10_5"
  # Crucial safety check: Only query the tracking API if the stop task actually executed
  when: output_task_10_5 is not skipped